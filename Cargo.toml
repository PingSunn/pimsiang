[workspace]
resolver = "3"
members = ["crates/engine", "crates/audio", "crates/store", "crates/platform-macos", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
audio = { path = "crates/audio" }
store = { path = "crates/store" }
platform-macos = { path = "crates/platform-macos" }
thiserror = "2"
anyhow = "1"
hound = "3.5"
realfft = "3.5"
clap = { version = "4.6", features = ["derive", "env"] }
ort = "=2.0.0-rc.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
