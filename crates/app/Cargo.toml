[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "pimsiang"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "pimsiang"
path = "src/main.rs"

[[bin]]
name = "transcribe"
path = "src/bin/transcribe.rs"

[dependencies]
engine.workspace = true
audio.workspace = true
store.workspace = true
platform.workspace = true
platform-macos.workspace = true
anyhow.workspace = true
clap.workspace = true
objc2 = "0.6"
winit = "0.30.13"
tray-icon = "0.26.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit", "macos-window-resize-jitter-fix"] }
pollster = "0.4"
ureq = "3"
semver = "1"
serde_json = "1"
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
sha2 = "0.10"
thiserror.workspace = true
zip = { version = "2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
