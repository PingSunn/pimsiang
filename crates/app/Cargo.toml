[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "pimsiang"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "pimsiang"
path = "src/main.rs"

[[bin]]
name = "transcribe"
path = "src/bin/transcribe.rs"

[dependencies]
engine.workspace = true
audio.workspace = true
platform.workspace = true
platform-macos.workspace = true
anyhow.workspace = true
clap.workspace = true
objc2 = "0.6"
winit = "0.30.13"
tray-icon = "0.26.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit", "macos-window-resize-jitter-fix"] }
pollster = "0.4"

[lints]
workspace = true
