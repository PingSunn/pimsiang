[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
arboard = "3.7.0"
core-foundation = "0.10"
core-graphics = "0.25.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBox", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSPanel", "NSParagraphStyle", "NSResponder", "NSScreen", "NSText", "NSTextField", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
platform.workspace = true
tracing = "0.1.44"
